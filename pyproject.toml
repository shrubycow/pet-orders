[project]
name = "pet-orders"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alexandr Shrubikov", email = "alexandriyskiy0@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=10.2.1",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi-mail>=1.6.8",
    "fastapi[standard]>=0.162.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.6",
]

[project.scripts]
pet-orders = "pet_orders:main"

[tool.fastapi]
entrypoint = "pet_orders.main:app"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]
output-format = "concise"
extend-exclude = [
    "src/pet_orders/migrations/versions",
    "src/pet_orders/migrations/env.py",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "FAST", # FastAPI
]
ignore = [
    "E501", # line length is enforced by the formatter
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.ruff.lint.isort]
known-first-party = ["pet_orders"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
