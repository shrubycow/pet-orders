services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pet}
      POSTGRES_DB: ${POSTGRES_DB:-pet_orders}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pet}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pet}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-pet}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-pet}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build: .
    image: pet-orders:local
    pull_policy: build
    restart: on-failure
    ports:
      - "8000:8000"
    env_file: .env
    depends_on: &app-depends
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    image: pet-orders:local
    pull_policy: build
    restart: on-failure
    command: ["python", "-m", "pet_orders.worker"]
    env_file: .env
    depends_on: *app-depends

volumes:
  pgdata:
  rabbitmqdata:
  redisdata:
